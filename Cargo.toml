[workspace]
members = ["crates/*"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "markdawn"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

[features]
default = ["highlight-all-languages"]
dioxus = ["dep:dioxus", "dep:dioxus-core"]
highlight = ["dep:arborium"]
# Convenience superset of `highlight` that pulls every tree-sitter
# parser arborium ships. On `default`, so native consumers get a
# fully-stocked highlighter without thinking about it. Wasm builds
# should set `default-features = false` and curate via a direct
# `arborium` dep — `all-languages` adds ~100 MB of static data.
highlight-all-languages = ["highlight", "arborium/all-languages"]
pikchr = ["dep:pikru", "dep:facet-dessert", "dep:facet-reflect", "dep:facet-path"]
graphviz = ["dep:markdawn-graphviz"]
typst = [
    "dep:typst",
    "dep:typst-svg",
    "dep:typst-pdf",
    "dep:typst-layout",
    "dep:typst-library",
    "dep:typst-syntax",
    "dep:typst-assets",
    "dep:comemo",
    "dep:ecow",
    "dep:include_dir",
]
ansi = ["dep:vte", "dep:strip-ansi-escapes"]
terminal = ["ansi", "dep:vt100"]
# Derive `serde::Serialize` for the `vdom` VNode tree so it can be
# handed to a JS frontend (e.g. via serde-wasm-bindgen). The canonical
# vdom renderer itself is always available; this only adds the
# serialization impls.
serde = ["dep:serde"]
tracey = ["dep:serde", "dep:serde_yaml", "dep:toml"]
iced = ["dep:iced_core", "dep:iced_widget", "dep:iced_runtime", "dep:iced_graphics"]
# The runnable demo also needs the umbrella `iced` (windowing/app runner).
iced-app = ["iced", "dep:iced"]

[dependencies]
arborium = { path = "../arborium/crates/arborium", optional = true, default-features = false }
base64 = "0.22"
dioxus = { version = "0.7", optional = true, default-features = false, features = ["lib"] }
dioxus-core = { version = "0.7", optional = true }
entities = "1.0"
facet-dessert = { version = "0.46.0", optional = true }
facet-reflect = { version = "0.46.0", optional = true }
facet-path = { version = "0.46.0", optional = true }
indexmap = "2"
mathml-core = { path = "../mathml-rs" }
percent-encoding = "2.3"
ttf-parser = "0.25"
pikru = { path = "../pikru", optional = true }
markdawn-graphviz = { path = "crates/markdawn-graphviz", optional = true }
typst = { version = "0.15", optional = true }
typst-svg = { version = "0.15", optional = true }
typst-pdf = { version = "0.15", optional = true }
typst-layout = { version = "0.15", optional = true }
typst-library = { version = "0.15", optional = true }
typst-syntax = { version = "0.15", optional = true }
typst-assets = { version = "0.15", optional = true, features = ["fonts"] }
comemo = { version = "0.5", optional = true }
ecow = { version = "0.2", optional = true }
include_dir = { version = "0.7", optional = true }
sanitizer = { path = "../sanitizer-rs" }
vte = { version = "0.14", optional = true }
strip-ansi-escapes = { version = "0.2", optional = true }
vt100 = { version = "0.16", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }
# The markdown adapter builds `Element` trees, so it depends on iced's
# widget-level crates — NOT the umbrella `iced`, whose unconditional
# `iced_winit` dep drags in winit + a conflicting wasm-bindgen tree. Tracks the
# same necessary-nu/iced fork branch ndesign's out/iced tracks so the `Element`
# types unify (the fork carries the AccessKit bridge; [dec:nd:iced-accesskit]).
iced_core = { git = "https://github.com/necessary-nu/iced", branch = "accesskit", optional = true, features = ["advanced"] }
iced_widget = { git = "https://github.com/necessary-nu/iced", branch = "accesskit", optional = true, features = ["advanced", "svg", "image"] }
iced_runtime = { git = "https://github.com/necessary-nu/iced", branch = "accesskit", optional = true }
iced_graphics = { git = "https://github.com/necessary-nu/iced", branch = "accesskit", optional = true }
# The umbrella `iced` (windowing + app runner) is only needed by the demo; gated
# behind `iced-app` so the library resolution stays winit-free.
iced = { git = "https://github.com/necessary-nu/iced", branch = "accesskit", optional = true, features = ["advanced", "tokio"] }

[patch.crates-io]
# Released citationberg 0.7.0 still selects vulnerable quick-xml 0.38;
# upstream has moved the same version to the security-fixed 0.41 API.
citationberg = { git = "https://github.com/typst/citationberg", rev = "06a591e2f237d25e1dfdedac3f3d1494c496c52d" }
# Upstream security fix for RUSTSEC-2026-0194/0195; remove after a
# wayland-scanner release newer than 0.31.10 includes d07c4f91.
wayland-scanner = { git = "https://github.com/Smithay/wayland-rs", rev = "d07c4f91f28b42e5a485823ffd9d8d5a210b1053" }

[dev-dependencies]
dioxus-ssr = "0.7"
serde_json = "1"

[[example]]
name = "ansi_demo"
required-features = ["ansi"]

# Half of the arborium-to-ntreesitter output parity check. Deleted with the
# arborium dependency itself; see the `ntreesitter` plan subtree.
[[example]]
name = "arborium_span_dump"
required-features = ["highlight-all-languages"]

[[example]]
name = "ssg_blog"
required-features = ["dioxus"]

[[example]]
name = "iced_demo"
required-features = ["iced-app"]

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSAttributedString",
    "NSCache",
    "NSData",
    "NSError",
    "NSString",
    "NSDictionary",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSURLSession",
    "NSValue",
    "block2",
] }
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFData"] }
objc2-ui-kit = { version = "0.3", features = [
    "UIAccessibility",
    "UIFont",
    "UIColor",
    "UIImage",
    "UIView",
    "UIImageView",
    "UIResponder",
    "UILabel",
    "UIStackView",
    "UITextView",
    "NSTextAttachment",
    "NSTextLayoutManager",
    "NSTextContentManager",
    "NSTextRange",
    "NSTextContainer",
    "NSTextStorage",
    "NSLayoutConstraint",
    "objc2-core-foundation",
] }
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
