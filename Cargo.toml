[workspace]
members = ["crates/*"]

[package]
name = "markdawn"
version = "0.1.0"
edition = "2024"

[features]
dioxus = ["dep:dioxus", "dep:dioxus-core"]
highlight = ["dep:arborium"]
pikchr = ["dep:pikru", "dep:facet-dessert", "dep:facet-reflect", "dep:facet-path"]
graphviz = ["dep:markdawn-graphviz"]
typst = [
    "dep:typst",
    "dep:typst-svg",
    "dep:typst-library",
    "dep:typst-syntax",
    "dep:typst-assets",
    "dep:comemo",
    "dep:ecow",
    "dep:include_dir",
]
ansi = ["dep:vte", "dep:strip-ansi-escapes"]
terminal = ["ansi", "dep:vt100"]
tracey = ["dep:serde", "dep:serde_yaml", "dep:toml"]
iced = ["dep:iced", "dep:iced_runtime", "dep:iced_graphics"]

[dependencies]
arborium = { path = "../arborium/crates/arborium", optional = true, features = ["all-languages"] }
base64 = "0.22"
dioxus = { version = "0.7", optional = true, default-features = false, features = ["lib"] }
dioxus-core = { version = "0.7", optional = true }
entities = "1.0"
facet-dessert = { version = "0.46.0", optional = true }
facet-reflect = { version = "0.46.0", optional = true }
facet-path = { version = "0.46.0", optional = true }
indexmap = "2"
mathml-core = { path = "../mathml-rs" }
percent-encoding = "2.3"
ttf-parser = "0.25"
pikru = { path = "../pikru", optional = true }
markdawn-graphviz = { path = "crates/markdawn-graphviz", optional = true }
typst = { version = "0.14", optional = true }
typst-svg = { version = "0.14", optional = true }
typst-library = { version = "0.14", optional = true }
typst-syntax = { version = "0.14", optional = true }
typst-assets = { version = "0.14", optional = true, features = ["fonts"] }
comemo = { version = "0.5", optional = true }
ecow = { version = "0.2", optional = true }
include_dir = { version = "0.7", optional = true }
sanitizer = { path = "../sanitizer-rs" }
vte = { version = "0.14", optional = true }
strip-ansi-escapes = { version = "0.2", optional = true }
vt100 = { version = "0.16", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }
iced = { version = "0.14", optional = true, default-features = false, features = ["advanced", "svg", "image", "tokio", "wgpu", "tiny-skia"] }
iced_runtime = { version = "0.14", optional = true }
iced_graphics = { version = "0.14", optional = true }

[dev-dependencies]
dioxus-ssr = "0.7"

[[example]]
name = "ssg_blog"
required-features = ["dioxus"]

[[example]]
name = "iced_demo"
required-features = ["iced"]

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSAttributedString",
    "NSCache",
    "NSData",
    "NSError",
    "NSString",
    "NSDictionary",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSURLSession",
    "NSValue",
    "block2",
] }
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFData"] }
objc2-ui-kit = { version = "0.3", features = [
    "UIAccessibility",
    "UIFont",
    "UIColor",
    "UIImage",
    "UIView",
    "UIImageView",
    "UIResponder",
    "UILabel",
    "UIStackView",
    "UITextView",
    "NSTextAttachment",
    "NSTextLayoutManager",
    "NSTextContentManager",
    "NSTextRange",
    "NSTextContainer",
    "NSTextStorage",
    "NSLayoutConstraint",
    "objc2-core-foundation",
] }
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"

