[package]
name = "markdawn"
version = "0.1.0"
edition = "2024"

[features]
dioxus = ["dep:dioxus", "dep:dioxus-core"]
highlight = ["dep:arborium"]
pikchr = ["dep:pikru", "dep:facet-dessert", "dep:facet-reflect", "dep:facet-path"]
ansi = ["dep:vte", "dep:strip-ansi-escapes"]
terminal = ["ansi", "dep:vt100"]

[dependencies]
arborium = { path = "../arborium/crates/arborium", optional = true, features = ["all-languages"] }
base64 = "0.22"
dioxus = { version = "0.7", optional = true, default-features = false, features = ["lib"] }
dioxus-core = { version = "0.7", optional = true }
entities = "1.0"
# pikru 1.2.0 → facet-dom → facet-dessert / facet-reflect / facet-path; cargo
# picks the latest patches in the ^0.44 range but the 0.44.6 versions secretly
# bumped to facet-core 0.45, which gives an incompatible Facet trait. Pin the
# whole facet stack to the last 0.44.5 patches that still use facet-core ^0.44.
facet-dessert = { version = "=0.44.5", optional = true }
facet-reflect = { version = "=0.44.5", optional = true }
facet-path = { version = "=0.44.4", optional = true }
indexmap = "2"
mathml-core = { path = "../mathml-rs" }
percent-encoding = "2.3"
pikru = { version = "1", optional = true }
vte = { version = "0.14", optional = true }
strip-ansi-escapes = { version = "0.2", optional = true }
vt100 = { version = "0.16", optional = true }

[dev-dependencies]
dioxus-ssr = "0.7"

[[example]]
name = "ssg_blog"
required-features = ["dioxus"]

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSAttributedString",
    "NSCache",
    "NSData",
    "NSError",
    "NSString",
    "NSDictionary",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSURLSession",
    "NSValue",
    "block2",
] }
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFData"] }
objc2-ui-kit = { version = "0.3", features = [
    "UIAccessibility",
    "UIFont",
    "UIColor",
    "UIImage",
    "UIView",
    "UIImageView",
    "UIResponder",
    "UILabel",
    "UIStackView",
    "UITextView",
    "NSTextAttachment",
    "NSTextLayoutManager",
    "NSTextContentManager",
    "NSTextRange",
    "NSTextContainer",
    "NSTextStorage",
    "NSLayoutConstraint",
    "objc2-core-foundation",
] }
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
