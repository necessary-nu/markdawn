[package]
name = "darwin-markdown"
version = "0.1.0"
edition = "2024"

[dependencies]
entities = "1.0"
indexmap = "2"
percent-encoding = "2.3"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSAttributedString",
    "NSString",
    "NSDictionary",
    "NSValue",
] }
objc2-ui-kit = { version = "0.3", features = [
    "UIFont",
    "UIColor",
] }
block2 = "0.6"
dispatch2 = "0.3"
