[package]
name = "markdawn-android"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Mirror markdawn-swift: the `highlight` machinery but zero baked grammars.
# Grammars are dynamic plugin .so's (the markdawn-swift-lang-* cdylibs)
# loaded at runtime and registered into the process-global store. Pikchr is
# built into the core Android .so; math (mathml-core) remains always-on.
markdawn = { path = "../..", default-features = false, features = [
    "serde",
    "highlight",
    "pikchr",
] }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
ntreesitter = { git = "https://github.com/necessary-nu/ntreesitter" }
ntreesitter-plugin = { git = "https://github.com/necessary-nu/ntreesitter" }
libc = "0.2"

[dev-dependencies]
# A real grammar, for the in-process highlight test only (production grammars
# are dynamic plugin .so's loaded via loadLanguage, never linked into core).
nts-lang-rust = { git = "https://github.com/necessary-nu/ntreesitter" }
