[package]
name = "markdawn-wasm-pikchr"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '-all']

[dependencies]
markdawn = { path = "../..", default-features = false, features = ["pikchr"] }
wasm-bindgen = "0.2"
