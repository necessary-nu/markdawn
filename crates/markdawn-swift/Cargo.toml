[package]
name = "markdawn-swift"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
markdawn = { path = "../..", default-features = false, features = ["highlight"] }
indexmap = "2"
tree-sitter-language = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-ui-kit = "0.3"
